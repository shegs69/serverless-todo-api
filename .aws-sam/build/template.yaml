AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'todo-api A simple serverless CRUD API for a todo list.

  '
Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Runtime: nodejs20.x
    Architectures:
    - x86_64
    Environment:
      Variables:
        TABLE_NAME:
          Ref: TodosTable
Resources:
  TodosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
  CreateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/createTodo.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TodosTable
      Events:
        CreateTodoApi:
          Type: Api
          Properties:
            Path: /todos
            Method: post
      CodeUri: CreateTodoFunction
    Metadata:
      SamResourceId: CreateTodoFunction
  GetTodosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getTodos.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TodosTable
      Events:
        GetTodosApi:
          Type: Api
          Properties:
            Path: /todos
            Method: get
      CodeUri: GetTodosFunction
    Metadata:
      SamResourceId: GetTodosFunction
  GetTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/getTodo.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TodosTable
      Events:
        GetTodoApi:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: get
      CodeUri: GetTodoFunction
    Metadata:
      SamResourceId: GetTodoFunction
  UpdateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/updateTodo.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TodosTable
      Events:
        UpdateTodoApi:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: put
      CodeUri: UpdateTodoFunction
    Metadata:
      SamResourceId: UpdateTodoFunction
  DeleteTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/deleteTodo.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TodosTable
      Events:
        DeleteTodoApi:
          Type: Api
          Properties:
            Path: /todos/{id}
            Method: delete
      CodeUri: DeleteTodoFunction
    Metadata:
      SamResourceId: DeleteTodoFunction
